{% extends 'frontend/base.html' %}
{% block title %}Change Password — PickASide{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="bg-card border border-border rounded-2xl p-8 space-y-6">
    <h1 class="text-xl font-bold text-foreground">Change Password</h1>
    {% if messages %}{% for m in messages %}<div class="rounded-xl border border-rose-400/30 bg-rose-50/70 dark:bg-rose-900/20 px-4 py-3 text-sm text-rose-700 dark:text-rose-300">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">Current Password</label>
        <input type="password" name="current_password" required class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">New Password</label>
        <input type="password" name="new_password" required minlength="8" class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">Confirm New Password</label>
        <input type="password" name="confirm_password" required class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-primary text-primary-foreground font-semibold text-sm hover:bg-primary/90 transition">Update Password</button>
    </form>
    <a href="{% url 'profile' %}" class="block text-center text-sm text-muted-foreground hover:text-primary">Back to Profile</a>
  </div>
</div>
{% endblock %}
