{% extends 'frontend/base.html' %}
{% block title %}Change Password — PickASide{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="bg-card border border-border rounded-2xl p-8 space-y-6">
    <h1 class="text-xl font-bold text-foreground">Change Password</h1>
    {% if messages %}{% for m in messages %}<div class="rounded-xl border border-rose-400/30 bg-rose-50/70 dark:bg-rose-900/20 px-4 py-3 text-sm text-rose-700 dark:text-rose-300">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">Current Password</label>
        <input type="password" name="current_password" required class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">New Password</label>
        <input type="password" name="new_password" id="pw-new" required minlength="8" class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
        <div class="mt-2 space-y-1">
          <div class="flex gap-1 h-1.5">
            <div class="flex-1 rounded-full bg-border transition-colors duration-200" id="pc-sb1"></div>
            <div class="flex-1 rounded-full bg-border transition-colors duration-200" id="pc-sb2"></div>
            <div class="flex-1 rounded-full bg-border transition-colors duration-200" id="pc-sb3"></div>
            <div class="flex-1 rounded-full bg-border transition-colors duration-200" id="pc-sb4"></div>
          </div>
          <p id="pc-label" class="text-xs text-muted-foreground"></p>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-muted-foreground mb-1">Confirm New Password</label>
        <input type="password" name="confirm_password" id="pw-confirm" required class="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30">
        <p id="pw-match-error" class="mt-1 text-xs text-red-600 hidden">Passwords do not match.</p>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-primary text-primary-foreground font-semibold text-sm hover:bg-primary/90 transition">Update Password</button>
    </form>
<script>
(function() {
  var bars = ['pc-sb1','pc-sb2','pc-sb3','pc-sb4'].map(function(id){ return document.getElementById(id); });
  var label = document.getElementById('pc-label');
  var newPw = document.getElementById('pw-new');
  var confirmPw = document.getElementById('pw-confirm');
  var matchErr = document.getElementById('pw-match-error');
  var COLORS = ['','bg-red-500','bg-orange-400','bg-yellow-400','bg-green-500'];
  var LABELS = ['','Weak','Fair','Good','Strong'];
  var LABEL_CLASSES = ['','text-red-500','text-orange-500','text-yellow-600','text-green-600'];

  function strength(v) {
    var s = 0;
    if (v.length >= 8) s++;
    if (v.length >= 12) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    return Math.min(4, Math.floor(s * 4 / 5));
  }

  newPw.addEventListener('input', function() {
    var v = this.value;
    var lvl = v.length === 0 ? 0 : Math.max(1, strength(v));
    bars.forEach(function(b, i) {
      b.className = 'flex-1 rounded-full transition-colors duration-200 ' + (i < lvl && COLORS[lvl] ? COLORS[lvl] : 'bg-border');
    });
    label.textContent = LABELS[lvl];
    label.className = 'text-xs ' + (LABEL_CLASSES[lvl] || 'text-muted-foreground');
  });

  confirmPw.addEventListener('input', function() {
    if (this.value && this.value !== newPw.value) {
      matchErr.classList.remove('hidden');
    } else {
      matchErr.classList.add('hidden');
    }
  });
})();
</script>
    <a href="{% url 'profile' %}" class="block text-center text-sm text-muted-foreground hover:text-primary">Back to Profile</a>
  </div>
</div>
{% endblock %}
