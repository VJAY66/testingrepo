<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ post.title }} — PickASide</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#111;padding:16px;font-size:14px}
  .title{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:8px}
  .meta{color:#666;font-size:12px;margin-bottom:10px}
  .content{color:#333;line-height:1.6;max-height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,black 70%,transparent)}
  .footer{margin-top:12px;display:flex;align-items:center;justify-content:space-between}
  .badge{background:#e0f2fe;color:#0369a1;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}
  .cta{color:#0ea5e9;font-size:12px;font-weight:600;text-decoration:none}
  .cta:hover{text-decoration:underline}
  .stats{color:#888;font-size:11px;display:flex;gap:10px}
</style>
</head>
<body>
<div class="title">{{ post.title }}</div>
<div class="meta">by @{{ post.user.username }} · {{ post.created_at|date:"M j, Y" }} · {{ post.category }}</div>
<div class="content">{{ post.content|truncatechars:280 }}</div>
<div class="footer">
  <div class="stats">
    <span>👍 {{ post.like_count|default:0 }}</span>
    <span>💬 {{ post.comment_count|default:0 }}</span>
  </div>
  <a href="/discussion/{{ post.id }}/" target="_blank" class="cta">Join the debate →</a>
</div>
</body>
</html>
