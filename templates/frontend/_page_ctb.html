{% comment %}
Shared content-type navigation bar for all list pages.
Pass active_ctb as one of: discussions, stocks, reviews, questions, polls
{% endcomment %}
<style>
.page-ctb-bar {
    position: sticky;
    top: 64px;
    z-index: 92;
    background: hsl(var(--background) / 0.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid hsl(var(--border) / 0.45);
}
.page-ctb-scroll {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 6px 12px 7px;
    max-width: 56rem;
    margin: 0 auto;
}
.page-ctb-scroll::-webkit-scrollbar { display: none; }
.page-ctb-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
    border: 1.5px solid hsl(var(--border) / 0.7);
    background: hsl(var(--card) / 0.7);
    color: hsl(var(--muted-foreground));
    transition: color 0.15s, border-color 0.18s, background 0.18s, box-shadow 0.18s;
    letter-spacing: 0.01em;
}
.page-ctb-chip:hover {
    color: hsl(var(--foreground));
    border-color: hsl(var(--primary) / 0.5);
    background: hsl(var(--card));
    box-shadow: 0 2px 12px -4px hsl(var(--primary) / 0.18);
}
.page-ctb-chip.page-ctb-active {
    color: hsl(var(--primary-foreground));
    background: hsl(var(--primary));
    border-color: hsl(var(--primary));
    box-shadow: 0 3px 14px -4px hsl(var(--primary) / 0.4);
}
.page-ctb-icon { font-size: 13px; line-height: 1; }
</style>

<div class="page-ctb-bar">
  <div class="page-ctb-scroll">

    <a href="{% url 'index' %}" class="page-ctb-chip">
      <span class="page-ctb-icon">⚡</span> All
    </a>
    <a href="{% url 'discussions_list' %}" class="page-ctb-chip {% if active_ctb == 'discussions' %}page-ctb-active{% endif %}">
      <span class="page-ctb-icon">⚔️</span> Pick a Side
    </a>
    <a href="{% url 'stocks_list' %}" class="page-ctb-chip {% if active_ctb == 'stocks' %}page-ctb-active{% endif %}">
      <span class="page-ctb-icon">📈</span> Stock Predictions
    </a>
    <a href="{% url 'reviews_list' %}" class="page-ctb-chip {% if active_ctb == 'reviews' %}page-ctb-active{% endif %}">
      <span class="page-ctb-icon">⭐</span> Reviews
    </a>
    <a href="{% url 'questions_list' %}" class="page-ctb-chip {% if active_ctb == 'questions' %}page-ctb-active{% endif %}">
      <span class="page-ctb-icon">❓</span> Questions
    </a>

  </div>
</div>
